# VoltCoach 发版流水线：tag（v*）即打包 release APK 挂 GitHub Release。
# 门禁（lint/单测/黄金 diff）前置——黄金 diff 依赖 gitignored 的真实素材，CI 上自动降级跳过。
# workflow_dispatch 手动触发只构建并上传 artifact、不发布（发版演练用）。
name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # 创建 Release 并上传 APK

jobs:
  release:
    runs-on: ubuntu-latest # 预装 OpenJDK 与 Android SDK，无需自配工具链
    timeout-minutes: 90
    concurrency:
      group: release-${{ github.ref }} # 同 ref 串行发版，防连打 tag 时 Release 竞态
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # 单测跑 .ts 需要 Node ≥ 23.6 原生 type stripping
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 门禁（lint + 单测 + 黄金 diff）
        run: |
          npm run lint
          npm test
          npm run golden

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # 版本戳：versionName 取 tag（v1.2.3 → 1.2.3），versionCode 用 run number 单调递增；
      # 手动触发（无 tag）跳过，维持 app.json 现值。
      - name: 版本戳（tag → versionName / run number → versionCode）
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/stamp-release-version.mjs "${GITHUB_REF_NAME#v}" "$GITHUB_RUN_NUMBER"

      - name: Expo prebuild（生成原生工程）
        run: npx expo prebuild --platform android --no-install

      # 签名（可选）：仓库 Secrets 未配置 ANDROID_KEYSTORE_* 时产物回退 debug 签名，
      # 仍可侧载体验，但不能作为正式版覆盖安装正式签名包（见 README「发版」）。
      # 四个 Secrets 必须要么全配、要么全不配——半配直接失败（防把 debug 签名包当正式版发出去）。
      - name: 准备签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          if [ -z "$KEYSTORE_B64" ]; then missing="$missing ANDROID_KEYSTORE_B64"; fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then missing="$missing ANDROID_KEYSTORE_PASSWORD"; fi
          if [ -z "$KEY_ALIAS" ]; then missing="$missing ANDROID_KEY_ALIAS"; fi
          if [ -z "$KEY_PASSWORD" ]; then missing="$missing ANDROID_KEY_PASSWORD"; fi
          if [ -n "$missing" ]; then
            echo "未配置的 Secrets:$missing"
            if [ -n "$KEYSTORE_B64$KEYSTORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]; then
              echo "✗ 签名 Secrets 只配了一半——要么配齐四个 ANDROID_KEYSTORE_*，要么全部不配（回退 debug 签名）"
              exit 1
            fi
            echo "未配置签名 Secrets —— 本次产物使用 debug 签名（不可覆盖安装正式签名包）"
            echo "SIGNING_NOTE=⚠ 本次产物为 **debug 签名**（正式发版需在仓库 Secrets 配置 ANDROID_KEYSTORE_*），不能覆盖安装正式签名包。" >> "$GITHUB_ENV"
          else
            # certutil -encode（Windows）输出带 -----BEGIN/END CERTIFICATE----- 头尾行
            # 与换行，先剥头尾再解码（纯 base64 粘贴则原样通过）
            printf '%s' "$KEYSTORE_B64" | grep -v -- '-----' | base64 -d > "$RUNNER_TEMP/voltcoach.keystore"
            {
              echo "VOLTCOACH_KEYSTORE_FILE=$RUNNER_TEMP/voltcoach.keystore"
              echo "VOLTCOACH_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "VOLTCOACH_KEY_ALIAS=$KEY_ALIAS"
              echo "VOLTCOACH_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "SIGNING_NOTE=正式签名发布（ANDROID_KEYSTORE_* Secrets）。" >> "$GITHUB_ENV"
          fi

      # Expo SDK 57 默认 NDK 27.1.12297006 不在 runner 预装清单内（镜像只有 27.3+），
      # 显式预装避免 AGP 自动下载不可控（升级 Expo SDK 时同步核对此版本号）
      - name: 预装 NDK（SDK 57 默认版本）
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006" > /dev/null

      - name: 注入 release 签名配置
        run: node scripts/patch-release-signing.mjs

      # 只打 arm64-v8a（2026-10-11 起）：现代安卓手机均为 arm64，四套 ABI 的通用包
      # ≈140MB vs 单 ABI ≈55MB——体积收益远大于老 32 位设备兼容（需通用包时本地自建，
      # 见 docs/RELEASING.md「产物变体」）
      - name: 打包 release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: 发版包体检（check:apk，bundle 端点口径）
        run: npm run check:apk

      # tag/分支名可能含 `/`（v1.0/rc1、feat/x），直接进文件名会在发布前最后一步崩掉，
      # 净化为 `-`（此时构建已完成，崩在命名步最浪费）
      - name: 整理产物命名（VoltCoach-<版本>.apk）
        run: |
          VERSION="${GITHUB_REF_NAME#v}"; VERSION="${VERSION//\//-}"
          cp android/app/build/outputs/apk/release/app-release.apk "VoltCoach-${VERSION}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: VoltCoach-APK
          path: VoltCoach-*.apk

      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: VoltCoach-*.apk
          body: ${{ env.SIGNING_NOTE }} # debug 签名产物在下载页自曝
          generate_release_notes: true
